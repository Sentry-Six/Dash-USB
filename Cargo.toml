[workspace]
resolver = "2"
members = [
    "crates/sentryusb",
    "crates/config",
    "crates/vehicle_profile",
    "crates/shell",
    "crates/ws",
    "crates/api",
    "crates/notify",
    "crates/usb_gadget",
    "crates/setup",
]

[workspace.package]
# PolyForm Noncommercial isn't an SPDX identifier, so reference the file.
# Derived TeslaUSB scripts stay MIT; see NOTICE for the per-file breakdown.
license-file = "LICENSE"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "signal", "sync", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Drop default `wasmbind` (we never target wasm) and the deprecated
# `oldtime` shim. `clock` pulls in `std` + `now` for the Utc::now() calls in
# backup, update checks, and notification timestamps. No chrono type is
# serialized, so the `serde` feature stays off.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
# Drops unwinding tables (~5-10 KB on ARM) and shrinks the binary further.
# No code uses `std::panic::catch_unwind` (grep -r confirms), so the
# behavioral change is a no-op: any panic now `abort()`s the process,
# which systemd restarts via Restart=always already in the unit file.
panic = "abort"
