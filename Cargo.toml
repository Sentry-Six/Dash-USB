[workspace]
resolver = "2"
members = [
    "crates/sentryusb",
    "crates/config",
    "crates/vehicle_profile",
    "crates/shell",
    "crates/ws",
    "crates/api",
    "crates/notify",
    "crates/usb_gadget",
    "crates/setup",
]

[workspace.package]
# PolyForm Noncommercial isn't an SPDX identifier, so reference the file.
# Derived TeslaUSB scripts stay MIT; see NOTICE for the per-file breakdown.
license-file = "LICENSE"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "signal", "sync", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `clock` supplies Utc::now(); wasm, oldtime, and serde support are unused.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
# No code catches panics; systemd restarts the process after abort.
panic = "abort"
