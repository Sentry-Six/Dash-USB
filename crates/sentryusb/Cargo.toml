[package]
# Keep the crate name `sentryusb`; the shipped binary is renamed below.
name = "sentryusb"
# Keep this aligned with the release tag; the API reports it as `binary_version`.
version = "1.0.6"
edition = "2024"

[dependencies]
tokio = { workspace = true }
libc = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["compression-full", "fs"] }
# Uncompressed embedding permits borrowed `.rodata`; build.sh supplies
# pre-compressed siblings for compressible assets.
rust-embed = { version = "8" }

sentryusb-shell = { path = "../shell", package = "sentryusb-shell" }
sentryusb-ws = { path = "../ws", package = "sentryusb-ws" }
sentryusb-api = { path = "../api", package = "sentryusb-api" }
sentryusb-vehicle-profile = { path = "../vehicle_profile", package = "sentryusb-vehicle-profile" }
sentryusb-setup = { path = "../setup", package = "sentryusb-setup" }
sentryusb-config = { path = "../config", package = "sentryusb-config" }
sentryusb-gadget = { path = "../usb_gadget", package = "sentryusb-gadget" }

[[bin]]
name = "dashusb"
path = "src/main.rs"
