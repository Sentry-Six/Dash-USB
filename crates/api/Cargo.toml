[package]
name = "sentryusb-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
axum = { version = "0.8", features = ["ws", "multipart"] }
ring = "0.17"
rand = "0.10"
# "stream" is required by update.rs's download_with_progress (bytes_stream).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
portable-pty = "0.9"
crc32fast = "1"
hex = "0.4"
futures-util = "0.3"
regex = "1"
libc = "0.2"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
sentryusb-config = { path = "../config", package = "sentryusb-config" }
sentryusb-vehicle-profile = { path = "../vehicle_profile", package = "sentryusb-vehicle-profile" }
sentryusb-shell = { path = "../shell", package = "sentryusb-shell" }
sentryusb-ws = { path = "../ws", package = "sentryusb-ws" }
sentryusb-notify = { path = "../notify", package = "sentryusb-notify" }
sentryusb-setup = { path = "../setup", package = "sentryusb-setup" }
sentryusb-gadget = { path = "../usb_gadget", package = "sentryusb-gadget" }

[dev-dependencies]
tempfile = "3"
# Only used by tests to read archives back and validate the hand-rolled writer.
zip = { version = "8", default-features = false }
