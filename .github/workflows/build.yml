name: Build & Release

on:
  push:
    tags: ['v*']
    # Branch pushes run test and lint only; build and release remain tag-gated.
    branches: [main, main-dev]
  # Compile-test pull requests without building or publishing releases.
  pull_request:
    branches: [main, main-dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Run the cross-build matrix only for releases or manual validation.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Ubuntu 22.04 keeps binaries compatible with Bookworm's glibc. aarch64
    # builds natively; armv7 uses the existing x86 cross toolchain.
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        # The runtime picker selects an aarch64 variant from /proc/cpuinfo:
        #   * a76 → Pi 5 (Cortex-A76, ARMv8.2 with LSE atomics)
        #   * a72 → Pi 4, Radxa ROCK 4C+ perf cluster (Cortex-A72)
        #   * a53 → Pi 3, Pi Zero 2 W, Allwinner H618 boards (Cortex-A53)
        # LLVM assumes optional ARMv8 crypto on a53/a72, but BCM2710/2711 lack
        # it; disable AES/SHA to prevent SIGILL. BCM2712/a76 supports it.
        include:
          - name: ARM64 a53 (Pi 3 / Pi Zero 2 W / Allwinner H618)
            runs_on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            cpu: cortex-a53
            cpu_features: "-C target-feature=-aes,-sha2"
            linker: cc
            gcc: ""
            artifact_suffix: linux-arm64-a53
          - name: ARM64 a72 (Pi 4 / Radxa ROCK 4C+)
            runs_on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            cpu: cortex-a72
            cpu_features: "-C target-feature=-aes,-sha2"
            linker: cc
            gcc: ""
            artifact_suffix: linux-arm64-a72
          - name: ARM64 a76 (Pi 5)
            runs_on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            cpu: cortex-a76
            cpu_features: ""
            linker: cc
            gcc: ""
            artifact_suffix: linux-arm64-a76
          - name: ARMv7 (Pi 2/3/Zero2W 32-bit)
            runs_on: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            cpu: cortex-a7
            cpu_features: ""
            linker: arm-linux-gnueabihf-gcc
            gcc: gcc-arm-linux-gnueabihf
            artifact_suffix: linux-armv7
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          # aarch64 builds natively; armv7 requires foreign-arch sources and GCC.
          case "${{ matrix.target }}" in
            aarch64-*)
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                brotli mold
              ;;
            armv7-*)
              UBUNTU_CODENAME=$(lsb_release -cs)
              echo "Ubuntu codename: $UBUNTU_CODENAME"
              # Remove stale runner sources before defining each architecture.
              sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
              sudo tee /etc/apt/sources.list >/dev/null <<EOF
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME} main restricted universe multiverse
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME}-updates main restricted universe multiverse
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME}-backports main restricted universe multiverse
          deb [arch=amd64,i386] http://security.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME}-security main restricted universe multiverse
          EOF
              sudo tee /etc/apt/sources.list.d/ports.list >/dev/null <<EOF
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME} main restricted universe multiverse
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME}-security main restricted universe multiverse
          EOF
              sudo dpkg --add-architecture armhf
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                ${{ matrix.gcc }} brotli
              ;;
          esac

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Include UI inputs, CPU flags, and host architecture to prevent stale
          # or incompatible target artifacts across variants.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-${{ matrix.cpu }}-${{ hashFiles('**/Cargo.lock', 'web/src/**', 'web/public/**', 'web/package-lock.json', 'web/package.json', 'web/index.html', 'web/vite.config.*', 'web/tsconfig*.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          set -e
          cd web
          npm ci
          npm run build
          cd ..
          # Never ship a binary with an empty embedded UI.
          if [ ! -s "web/dist/index.html" ]; then
            echo "::error::web/dist/index.html missing or empty after npm run build"
            exit 1
          fi
          rm -rf crates/sentryusb/static
          cp -r web/dist crates/sentryusb/static
          if [ ! -s "crates/sentryusb/static/index.html" ] || [ -z "$(ls -A crates/sentryusb/static/assets 2>/dev/null)" ]; then
            echo "::error::crates/sentryusb/static is empty or missing assets after copy"
            exit 1
          fi
          # Pre-compress text assets to avoid per-request work on Pi hardware.
          PRECOMP=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.br|*.gz|*.woff2|*.png|*.jpg|*.jpeg|*.webp|*.ico|*.gif|*.mp4|*.mp3|*.zip) continue ;;
            esac
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -lt 1024 ]; then continue; fi
            gzip -9 -k -f "$f"
            brotli -q 11 --keep --force "$f"
            PRECOMP=$((PRECOMP + 1))
          done < <(find crates/sentryusb/static -type f -print0)
          echo "Frontend rebuilt; embedded $(ls crates/sentryusb/static/assets | wc -l) asset(s); pre-compressed $PRECOMP file(s)"

      - name: Validate Cargo.lock
        # Fail on lockfile inconsistency before the slower build.
        run: cargo fetch --target ${{ matrix.target }}

      - name: Build release binaries (dashusb)
        # RUSTFLAGS tunes each variant. mold supports native aarch64, while
        # Ubuntu 22.04's mold lacks armelf_linux_eabi for armv7.
        run: |
          export RUSTFLAGS="-C target-cpu=${{ matrix.cpu }} ${{ matrix.cpu_features }}"
          case "${{ matrix.target }}" in
            aarch64-*) BUILD_WRAPPER="mold -run" ;;
            *)         BUILD_WRAPPER="" ;;
          esac
          $BUILD_WRAPPER cargo build --release --target ${{ matrix.target }} -p sentryusb
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: ${{ matrix.linker }}

      - name: Package binaries
        # The updater and picker expect dashusb-${suffix} artifact names.
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/dashusb release/dashusb-${{ matrix.artifact_suffix }}
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dashusb-${{ matrix.artifact_suffix }}-bundle
          path: release/*

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build
        # Preserve dependencies even after a failed test run.
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run tests
        run: cargo test --workspace

      # Exercise archiveloop code that Cargo cannot see.
      - name: Run shell tests
        run: bash test/archiveloop-gadget-cycle.test.sh run/archiveloop

  lint-web:
    name: Lint web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint
        # Ratchet the reviewed warning budget downward only.
        run: |
          cd web
          npm ci
          npx eslint . --max-warnings 30

  release:
    name: Create Release
    # Require the only job that runs eslint.
    needs: [build, test, lint-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: release/
          merge-multiple: true

      - name: List release files
        run: ls -lh release/

      # Preserve a manual prerelease flag; GH_REPO is required without checkout.
      - name: Read existing pre-release flag
        id: relmeta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if pre=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease 2>err.txt); then
            echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          elif grep -qi "not found" err.txt; then
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          # Release notes are written manually.
          generate_release_notes: false
          # Preserve manual prerelease state and the configured tag override.
          prerelease: ${{ contains(github.ref_name, '-') || vars.DASHUSB_PRERELEASE_TAG == github.ref_name || steps.relmeta.outputs.prerelease == 'true' }}
