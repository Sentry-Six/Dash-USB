name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Run contributor-assistant v2.6.1 on GitHub's current Node 24 runtime.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: CLA Assistant
        # The action handles whitespace-tolerant sign/recheck matching itself.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `repo`-scoped PAT used to write the signatures branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGN_TOKEN }}
        with:
          path-to-document: 'https://github.com/Sentry-Six/Dash-USB/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          # Keep signatures off main.
          branch: 'cla-signatures'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >
            Thanks for your pull request! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/Sentry-Six/Dash-USB/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to do this once.
          # Maintainers and automation exempt from signing.
          allowlist: 'Scottmg1,ChadR23,chufleco,dependabot[bot]'
