name: Sync wiki

# Sync wiki/ to Dash-USB.wiki.git after wiki changes or manual dispatch.
# The GitHub wiki must be initialized once through the Wiki tab.

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push wiki/ to GitHub wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki/
          token: ${{ secrets.GITHUB_TOKEN }}
