# Rivian Road Cam (continuous drive recording) — PROVISIONAL, untested in a car.
#
# Seen in a directory listing of a real drive (folders only, no file names):
#   RoadCam/DriveStream/MM_DD_YY_HHMMSS/   one folder per recording session
#   RoadCam/SaveClips, GearGuardVideo/Incidents, IncidentCam, LaunchCam,
#   VideoExport                            saved/event footage, not handled yet
# Seen in one owner's incident clip (five files, 120 s each, no audio):
#   09_05_26_174959_video_frontCenter.mp4  MM_DD_YY_HHMMSS in local time
#   frontCenter, rearCenter, sideLeft, sideRight: H.264 1920x1536@30, 10 Mbit/s
#   gearGuard (bed camera on the R1T):           H.264 1280x720@30,   4 Mbit/s
# Reported by owners, not verified here: the car wants FAT32 on 128 GB-2 TB,
# speed-tests the drive, deletes the oldest continuous footage only when the
# drive fills, and (Gen 1) writes one mp4 per camera about every 15 minutes.
# Unknown: the file names inside a DriveStream session folder. They are
# assumed to follow the incident clip's naming.

[profile]
id = "rivian_roadcam"
display_name = "Rivian Road Cam"
brand = "Rivian"
experimental = true

[recording]
root = "RoadCam/DriveStream"
# Match the path below `root`, so a clip is named <session folder>__<file>.
match_relative_path = true
# Takes the timestamp from the file name when it has one (the incident clip's
# naming), else from the session folder. Any other mp4 in a session folder
# still matches, with its file stem as the camera, so nothing goes unarchived:
#   09_05_26_173818__09_05_26_174959_video_frontCenter.mp4
#   09_05_26_173818__video_frontCenter.mp4
#   09_05_26_173818__anything.mp4
filename_regex = '^(?:\d{2}_\d{2}_\d{2}_\d{6}__)?(?P<mo>\d{2})_(?P<d>\d{2})_(?P<y>\d{2})_(?P<h>\d{2})(?P<mi>\d{2})(?P<s>\d{2})_{1,2}(?:video_)?(?P<camera>[A-Za-z0-9_-]+)\.(?:mp4|MP4)$'
# Owner-reported for Gen 1; only the viewer's pre-probe duration uses it.
segment_seconds = 900
# No age-based delete: the car removes the oldest footage when the drive fills.
rolling_window_minutes = 0
# Unknown for continuous footage; only used to size drives for cars with a
# rolling window. (The incident clip above is ~75 MB per camera-minute.)
approx_bytes_per_camera_segment = 0

[[cameras]]
id = "frontCenter"
label = "Front"

[[cameras]]
id = "sideLeft"
label = "Left"

[[cameras]]
id = "sideRight"
label = "Right"

[[cameras]]
id = "rearCenter"
label = "Rear"

# Present in the incident clip; shown only when matching files exist.
[[cameras]]
id = "gearGuard"
label = "Gear Guard"
optional = true

[viewer]
# Row-major playback grid; "" is empty. Present optional cameras are appended.
grid = [["sideLeft", "frontCenter", "sideRight"], ["", "rearCenter", ""]]

[virtual_drive]
default_size = "128G"
min_size = "128G"
filesystem = "fat32"
label = "DASHUSB"
# Dash USB's own post-archive floor (32 GiB), not a Rivian requirement.
min_free_bytes = 34359738368

[snapshots]
default_interval_secs = 900

[features]
event_folders = false
archive_everything_default = true
# Suppress FUA writes; snapshots tolerate incomplete tails after power loss.
nofua = true
