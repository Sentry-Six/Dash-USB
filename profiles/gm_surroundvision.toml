# GM Surround Vision Recorder layout and drive constraints.

[profile]
id = "gm_surroundvision"
display_name = "GM Surround Vision"
brand = "GM"

[recording]
# Recording root created by the vehicle on the virtual drive.
root = "Android/media/com.gm.ultifi.gmconnectedcameraservice/Recordings/SurroundVisionRecorder"
# Segment filenames: FRONT_2026_07_17_T_19_34_53.mp4
filename_regex = '^(?P<camera>FRONT|LEFT|RIGHT|REAR|INTERIOR)_(?P<y>\d{4})_(?P<mo>\d{2})_(?P<d>\d{2})_T_(?P<h>\d{2})_(?P<mi>\d{2})_(?P<s>\d{2})\.mp4$'
segment_seconds = 300
# The car hard-deletes footage older than this regardless of drive size.
# Dash USB's snapshot loop must capture segments well inside this window.
rolling_window_minutes = 120
# ~106 MB per camera per 5-minute segment (H.264 1280x768@30).
approx_bytes_per_camera_segment = 111000000

[[cameras]]
id = "FRONT"
label = "Front"

[[cameras]]
id = "LEFT"
label = "Left"

[[cameras]]
id = "RIGHT"
label = "Right"

[[cameras]]
id = "REAR"
label = "Rear"

# Optional; the viewer shows it only when matching files exist.
[[cameras]]
id = "INTERIOR"
label = "Interior"
optional = true

[viewer]
# Row-major playback grid; "" is empty. Present optional cameras are appended.
grid = [["LEFT", "FRONT", "RIGHT"], ["", "REAR", ""]]

[virtual_drive]
# Required format, capacity, and free-space floor.
default_size = "64G"
min_size = "64G"
filesystem = "fat32"
label = "DASHUSB"
# Post-archive free-space floor in bytes (32 GiB).
min_free_bytes = 34359738368

[snapshots]
# Eight capture opportunities per two-hour rolling window; overridable with
# SNAPSHOT_INTERVAL.
default_interval_secs = 900

[features]
# All recordings age out of the rolling window, so archive everything.
event_folders = false
archive_everything_default = true
# Suppress FUA writes; snapshots tolerate incomplete tails after power loss.
nofua = true
